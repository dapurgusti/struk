<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Struk Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f1efe9;--card:#fff;--ink:#222;--mute:#777;--line:#ddd8cc;--acc:#2f5d50}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:400px 1fr;gap:20px;max-width:1120px;margin:0 auto;padding:20px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 12px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.blk.drag{opacity:.9;box-shadow:0 8px 20px rgba(0,0,0,.2);position:relative;z-index:5}
.bh{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;font-weight:600}
.bh span.t{flex:1}
.grip{cursor:grab;touch-action:none;color:var(--mute);font-size:16px;padding:0 4px;user-select:none}
.bh button{border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;padding:2px 7px}
.bh .del{color:#c0392b}
.bb{padding:4px 10px 10px;display:none;border-top:1px solid var(--line)}
.blk.open .bb{display:block}
label{display:block;margin-top:8px;font-size:12px;color:var(--mute)}
input,textarea,select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;font:inherit;background:#fff}
input[type=color]{height:34px;padding:2px;cursor:pointer}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:6px;align-items:center}
.row input{margin:0}
.money{display:flex;align-items:center;gap:4px}
.money span{color:var(--mute);white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;margin-top:8px}
.tbl th{font-size:12px;color:var(--mute);text-align:left;font-weight:500;padding:2px 3px}
.tbl td{padding:3px;vertical-align:top}
.tbl td input.cn{margin-top:4px}
.tbl .x{border:1px solid var(--line);background:#fff;color:#c0392b;border-radius:5px;cursor:pointer;padding:5px 8px}
.add{display:flex;gap:6px}
.add select{flex:1}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.top .btns{display:flex;gap:6px}
#receipt .credit{margin-top:10px;font-size:10px;opacity:.7;letter-spacing:.3px}
.stage{background:#e7e4db;border-radius:10px;padding:24px 10px;display:flex;justify-content:center;overflow:auto}
.stage.checker{background-color:#fff;background-image:linear-gradient(45deg,#e3e0d8 25%,transparent 25%,transparent 75%,#e3e0d8 75%),linear-gradient(45deg,#e3e0d8 25%,transparent 25%,transparent 75%,#e3e0d8 75%);background-size:16px 16px;background-position:0 0,8px 8px}
#capture{display:block;flex:none}
#receipt{position:relative;width:300px;color:#111;font-size:12px;line-height:1.5}
#receipt .ct{position:relative}
#receipt .c{text-align:center}
#receipt .sep{white-space:nowrap;overflow:hidden;margin:4px 0}
#receipt .lr{display:flex;justify-content:space-between;gap:8px}
#receipt img.logo{display:block;margin:0 auto 6px}
#receipt .qr{display:flex;justify-content:center;margin-top:8px}
#receipt .bars{height:46px;margin:8px auto 0;width:80%;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 8px,#111 8px 11px,#fff 11px 13px)}
.t-thermal #receipt{font-family:"Courier New",monospace}
.t-modern #receipt{font-family:system-ui,sans-serif}
.t-modern #receipt .sep{border-top:1px solid #ddd;height:0;font-size:0;margin:8px 0}
.t-minimal #receipt{font-family:Georgia,serif}
.t-minimal #receipt .sep{border-top:1px dotted #999;height:0;font-size:0;margin:8px 0}
.t-bold #receipt{font-family:"Arial Black",Arial,sans-serif}
.t-bold #receipt .sep{border-top:3px solid #111;height:0;font-size:0;margin:8px 0}
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>Struk Maker</h1>
    <div id="blocks"></div>
    <div class="add">
      <select id="addType"></select>
      <button class="btn ghost" id="addBtn" style="margin:0">+ Tambah blok</button>
    </div>
    <label class="row" style="margin-top:12px;cursor:pointer"><input type="checkbox" id="credit" style="width:auto" checked> Tampilkan footer "Create : @fixs.arts"</label>
    <label class="row" style="margin-top:8px;cursor:pointer"><input type="checkbox" id="chgOn" style="width:auto"> Aktifkan uang customer &amp; kembalian</label>
    <div id="chgBox" style="display:none;margin-top:6px"><label style="margin-top:0">Tunai</label><div class="money"><span>Rp.</span><input id="chgPaid" inputmode="numeric" placeholder="0"></div></div>
  </div>
  <div>
    <div class="top">
      <h1 style="margin:0">Preview</h1>
      <div class="btns">
        <button class="btn" id="dl">Download PNG</button>
        <button class="btn" id="dlPdf">Download PDF</button>
      </div>
    </div>
    <div class="stage" id="stage"><div id="capture"><div id="receipt"></div></div></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n?Number(n).toLocaleString('id-ID'):'';
const rp=n=>'Rp. '+Number(n||0).toLocaleString('id-ID');
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`};

/* ===== DAFTAR PRODUK (edit di sini untuk menambah produk) ===== */
const PRODUCTS=[
  {name:'Risol',price:4000},
  {name:'Ricebowl',price:10000},
  {name:'Teh Poci Original',price:4000},
  {name:'Teh Poci Rasa',price:5000},
  {name:'Kentang Goreng',price:12000}
];
/* Item awal otomatis diambil dari PRODUCTS di atas (berapa produk pertama yang tampil) */
const DEFAULT_ITEM_COUNT=3;
const QTY=Array.from({length:20},(_,i)=>i+1);

/* ===== BENTUK KERTAS ===== */
const SHAPES={
  zigzag:   {n:'Gerigi segitiga (atas & bawah)',top:'zig',bot:'zig'},
  zigbawah: {n:'Gerigi segitiga (bawah saja)',top:'flat',bot:'zig'},
  gelombang:{n:'Gelombang',top:'wave',bot:'wave'},
  bundar:   {n:'Tepi bundar / scallop',top:'scal',bot:'scal'},
  perforasi:{n:'Perforasi (lubang setengah lingkaran)',top:'notch',bot:'notch'},
  sobek:    {n:'Sobekan tidak rata',top:'torn',bot:'torn'},
  sobekbwh: {n:'Sobekan bawah saja',top:'flat',bot:'torn'},
  tiket:    {n:'Tiket (lekuk samping)',k:'ticket'},
  perangko: {n:'Perangko (perforasi 4 sisi)',k:'stamp'},
  membulat: {n:'Sudut membulat',k:'round'},
  potong:   {n:'Sudut terpotong',k:'chamfer'},
  lurus:    {n:'Lurus (kotak)',k:'rect'}
};

function padsOf(sp,t){
  const e=k=>(!k||k==='flat')?0:t+2;
  if(sp.k==='ticket')return{t:0,b:0,x:8};
  if(sp.k==='stamp')return{t:10,b:10,x:10};
  if(sp.k==='round')return{t:4,b:4,x:0};
  if(sp.k==='chamfer')return{t:6,b:6,x:0};
  if(sp.k)return{t:0,b:0,x:0};
  return{t:e(sp.top),b:e(sp.bot),x:0};
}

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let z=Math.imul(a^a>>>15,1|a);z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296}}

/* Membuat sisi atas (kiri→kanan). Sisi bawah = sisi atas diputar 180° lewat fungsi T */
function edgeCmds(kind,W,t,T,seed){
  const P=(x,y)=>{const q=T(x,y);return q[0].toFixed(1)+' '+q[1].toFixed(1)};
  let y0=0,d='';
  if(kind==='zig'){
    const n=Math.max(2,Math.round(W/(t*2))),st=W/n;y0=t;
    d+=`L${P(0,t)}`;
    for(let i=0;i<n;i++)d+=`L${P((i+.5)*st,0)}L${P((i+1)*st,t)}`;
  }else if(kind==='scal'){
    const n=Math.max(2,Math.round(W/(t*2.4))),st=W/n;y0=t;
    d+=`L${P(0,t)}`;
    for(let i=0;i<n;i++)d+=`A${(st/2).toFixed(1)} ${t} 0 0 1 ${P((i+1)*st,t)}`;
  }else if(kind==='wave'){
    const n=Math.max(2,Math.round(W/(t*3))),st=W/n,N=Math.ceil(W/3);y0=t/2;
    for(let i=0;i<=N;i++){const x=i*W/N;d+=`L${P(x,t/2+(t/2)*Math.sin(2*Math.PI*x/st))}`}
  }else if(kind==='notch'){
    const n=Math.max(2,Math.round(W/(t*2.2))),st=W/n,r=Math.min(t*.7,st*.35);
    d+=`L${P(0,0)}`;
    for(let i=0;i<n;i++){const c=(i+.5)*st;d+=`L${P(c-r,0)}A${r.toFixed(1)} ${r.toFixed(1)} 0 0 0 ${P(c+r,0)}`}
    d+=`L${P(W,0)}`;
  }else if(kind==='torn'){
    const R=rng(seed);y0=R()*t;let x=0;
    d+=`L${P(0,y0)}`;
    while(x<W){x=Math.min(W,x+4+R()*6);d+=`L${P(x,R()*t)}`}
  }else{
    d+=`L${P(0,0)}L${P(W,0)}`;
  }
  return{y0,d};
}

function shapePath(sp,W,H,t){
  if(sp.k==='rect')return `M0 0H${W}V${H}H0Z`;
  if(sp.k==='round'){const r=16;return `M${r} 0H${W-r}Q${W} 0 ${W} ${r}V${H-r}Q${W} ${H} ${W-r} ${H}H${r}Q0 ${H} 0 ${H-r}V${r}Q0 0 ${r} 0Z`}
  if(sp.k==='chamfer'){const c=18;return `M${c} 0H${W-c}L${W} ${c}V${H-c}L${W-c} ${H}H${c}L0 ${H-c}V${c}Z`}
  if(sp.k==='ticket'){const r=14,y=H*.5;return `M0 0H${W}V${y-r}A${r} ${r} 0 0 0 ${W} ${y+r}V${H}H0V${y+r}A${r} ${r} 0 0 0 0 ${y-r}Z`}
  if(sp.k==='stamp'){
    const r=6,nx=Math.max(3,Math.round(W/(r*2.6))),ny=Math.max(3,Math.round(H/(r*2.6))),sx=W/nx,sy=H/ny;
    let d='M0 0';
    for(let i=0;i<nx;i++){const c=(i+.5)*sx;d+=`L${c-r} 0A${r} ${r} 0 0 0 ${c+r} 0`}
    d+=`L${W} 0`;
    for(let i=0;i<ny;i++){const c=(i+.5)*sy;d+=`L${W} ${c-r}A${r} ${r} 0 0 0 ${W} ${c+r}`}
    d+=`L${W} ${H}`;
    for(let i=0;i<nx;i++){const c=W-(i+.5)*sx;d+=`L${c+r} ${H}A${r} ${r} 0 0 0 ${c-r} ${H}`}
    d+=`L0 ${H}`;
    for(let i=0;i<ny;i++){const c=H-(i+.5)*sy;d+=`L0 ${c+r}A${r} ${r} 0 0 0 0 ${c-r}`}
    return d+'Z';
  }
  const top=edgeCmds(sp.top||'flat',W,t,(x,y)=>[x,y],11);
  const bot=edgeCmds(sp.bot||'flat',W,t,(x,y)=>[W-x,H-y],29);
  return `M0 ${top.y0.toFixed(1)}${top.d}${bot.d}Z`;
}

/* Input harga: ketik 18000 -> otomatis jadi 18.000 */
function moneyInput(inp){
  const digitsBefore=inp.value.slice(0,inp.selectionStart).replace(/\D/g,'').length;
  const n=+inp.value.replace(/\D/g,'')||0;
  inp.value=fmt(n);
  let p=0,c=0;
  while(p<inp.value.length&&c<digitsBefore){if(/\d/.test(inp.value[p]))c++;p++}
  inp.setSelectionRange(p,p);
  return n;
}
const moneyHTML=(v,attr)=>`<div class="money"><span>Rp.</span><input inputmode="numeric" placeholder="0" value="${fmt(v)}" ${attr}></div>`;

const sumItems=items=>items.reduce((s,i)=>s+(i.qty||0)*(i.price||0),0);

const TYPES={
 settings:{name:'Pengaturan',fields:[
  {k:'template',l:'Gaya font struk',t:'select',o:[['thermal','Thermal (monospace)'],['modern','Modern'],['minimal','Minimal (serif)'],['bold','Bold']]},
  {k:'shape',l:'Bentuk kertas',t:'select',o:Object.entries(SHAPES).map(([k,v])=>[k,v.n])},
  {k:'width',l:'Lebar struk (px)',t:'number'},
  {k:'t',l:'Ukuran gerigi / lekuk (px)',t:'number'},
  {k:'paper',l:'Warna kertas',t:'color'},
  {k:'bgMode',l:'Background',t:'select',o:[['none','Tanpa background (transparan)'],['solid','Warna solid'],['grad','Gradasi']]},
  {k:'bg1',l:'Warna background (gradasi: warna 1)',t:'color'},
  {k:'bg2',l:'Warna gradasi 2',t:'color'},
  {k:'pad',l:'Jarak kertas ke tepi gambar (px)',t:'number'},
  {k:'shadow',l:'Bayangan kertas',t:'check'},
  {k:'scale',l:'Kualitas export',t:'select',o:[['2','Normal (2x)'],['3','Tajam (3x)'],['4','Sangat tajam (4x)']]},
  {k:'sep',l:'Karakter garis (gaya thermal)',t:'text'}],
  def:{template:'thermal',shape:'zigzag',width:300,t:10,paper:'#ffffff',bgMode:'none',bg1:'#d9482b',bg2:'#8e2410',pad:28,shadow:false,scale:'3',sep:'='},render:()=>''},
 logo:{name:'Logo',fields:[{k:'src',l:'Upload logo',t:'file'},{k:'size',l:'Ukuran (px)',t:'number'}],
  def:{src:'',size:90},render:d=>d.src?`<img class="logo" style="max-width:${d.size}px;max-height:${d.size}px" src="${d.src}">`:''},
 header:{name:'Header',fields:[{k:'name',l:'Nama toko',t:'text'},{k:'addr',l:'Alamat',t:'textarea'},{k:'phone',l:'No. Telp',t:'text'}],
  def:{name:'Dapur Gusti',addr:'Jl. Keramat Raya - Banjarmasin',phone:'+62 857-5534-3155'},
  render:d=>`<div class="c"><b style="font-size:15px">${esc(d.name)}</b><br>${esc(d.addr).replace(/\n/g,'<br>')}<br>${esc(d.phone)}</div>`},
 datetime:{name:'Tanggal & Waktu',fields:[{k:'auto',l:'Pakai waktu sekarang',t:'check'},{k:'value',l:'Atau isi manual',t:'text'}],
  def:{auto:true,value:''},render:d=>`<div class="c">${esc(d.auto?now():d.value)}</div>`},
 info:{name:'Info Tambahan',fields:[{k:'rows',l:'Satu baris per item (Label: Isi)',t:'textarea'}],
  def:{rows:'Order #: 001\nKasir: Admin'},
  render:d=>d.rows.split('\n').filter(Boolean).map(r=>{const i=r.indexOf(':');return i<0?`<div>${esc(r)}</div>`:`<div class="lr"><span>${esc(r.slice(0,i+1))}</span><span>${esc(r.slice(i+1).trim())}</span></div>`}).join('')},
 items:{name:'Daftar Item',fields:[{k:'items',t:'items'}],
  /* item awal otomatis mengikuti PRODUCTS */
  def:{items:PRODUCTS.slice(0,DEFAULT_ITEM_COUNT).map(p=>({qty:1,name:p.name,price:p.price,custom:false}))},
  render:d=>d.items.map(i=>`<div class="lr"><span>${i.qty}x ${esc(i.name)}</span><span>${rp(i.qty*i.price)}</span></div>`).join('')},
 totals:{name:'Total',fields:[{k:'tax',l:'Pajak (%)',t:'number'},{k:'disc',l:'Diskon',t:'money'}],
  def:{tax:0,disc:0},render:(d,all)=>{
   const it=all.find(b=>b.type==='items');
   const sub=it?sumItems(it.data.items):0;
   const tax=Math.round((sub-d.disc)*d.tax/100);
   return `<div class="lr"><span>Subtotal</span><span>${rp(sub)}</span></div>`
    +(d.disc?`<div class="lr"><span>Diskon</span><span>-${rp(d.disc)}</span></div>`:'')
    +(d.tax?`<div class="lr"><span>Pajak ${d.tax}%</span><span>${rp(tax)}</span></div>`:'')
    +`<div class="lr"><b>TOTAL</b><b>${rp(sub-d.disc+tax)}</b></div>`}},
 payment:{name:'Pembayaran',fields:[{k:'rows',l:'Satu baris per item (Label: Isi)',t:'textarea'}],
  def:{rows:'Metode: Tunai\nStatus: Lunas'},render:d=>TYPES.info.render(d)},
 message:{name:'Pesan',fields:[{k:'text',l:'Pesan',t:'textarea'}],
  def:{text:'Terima kasih!\nSelamat menikmati'},render:d=>`<div class="c">${esc(d.text).replace(/\n/g,'<br>')}</div>`},
 barcode:{name:'Barcode / QR',fields:[{k:'mode',l:'Jenis',t:'select',o:['qr','barcode']},{k:'text',l:'Isi QR',t:'text'}],
  def:{mode:'qr',text:'Dapur Gusti'},render:d=>d.mode==='qr'?`<div class="qr" data-qr="${esc(d.text)}"></div>`:`<div class="bars"></div>`}
};

let blocks=[],uid=0;
const add=type=>blocks.push({id:++uid,type,open:false,data:JSON.parse(JSON.stringify(TYPES[type].def))});
['settings','logo','header','datetime','info','items','totals','payment','message','barcode'].forEach(add);

let paidAmt=0;
function calcTotal(all){
  const it=all.find(b=>b.type==='items'), tt=all.find(b=>b.type==='totals');
  const sub=it?sumItems(it.data.items):0, d=tt?tt.data:{tax:0,disc:0};
  return sub-d.disc+Math.round((sub-d.disc)*d.tax/100);
}
/* Uang customer & kembalian (aktif kalau toggle dicentang) */
function changeHTML(){
  if(!$('#chgOn').checked)return '';
  const diff=paidAmt-calcTotal(blocks);
  return `<div class="lr"><span>Tunai
  </span><span>${rp(paidAmt)}</span></div>`
   +`<div class="lr"><b>${diff<0?'Kembalian':'KEMBALIAN'}</b><b>${rp(Math.abs(diff))}</b></div>`;
}
/* Daftar bagian struk; kembalian muncul tepat setelah blok Total */
function sections(){
  const out=[];
  blocks.forEach(b=>{
    if(b.type==='settings')return;
    const h=TYPES[b.type].render(b.data,blocks);
    if(h)out.push(h);
    if(b.type==='totals'){const c=changeHTML();if(c)out.push(c)}
  });
  if(!blocks.some(b=>b.type==='totals')){const c=changeHTML();if(c)out.push(c)}
  return out;
}

const settings=()=>(blocks.find(b=>b.type==='settings')||{data:TYPES.settings.def}).data;

function renderReceipt(){
  const s=settings(), r=$('#receipt'), cap=$('#capture');
  const W=+s.width||300, t=Math.max(4,+s.t||10);
  const sp=SHAPES[s.shape]||SHAPES.lurus, pd=padsOf(sp,t);
  $('#stage').className='stage t-'+s.template+(s.bgMode==='none'?' checker':'');
  /* background di belakang kertas */
  const pad=(s.bgMode==='none'&&!s.shadow)?0:Math.max(+s.pad||0,s.shadow?32:0);
  cap.style.padding=pad+'px';
  cap.style.background=s.bgMode==='solid'?s.bg1:s.bgMode==='grad'?`linear-gradient(160deg,${s.bg1},${s.bg2})`:'transparent';
  /* isi struk */
  r.style.width=W+'px';
  r.style.padding=`${22+pd.t}px ${16+pd.x}px ${22+pd.b}px`;
  const sep=s.template==='thermal'?`<div class="sep">${esc(s.sep||'=').repeat(80)}</div>`:'<div class="sep"></div>';
  r.innerHTML='<div class="ct">'+sections().join(sep)+($('#credit').checked?'<div class="c credit">Create : @fixs.arts</div>':'')+'</div>';
  r.querySelectorAll('[data-qr]').forEach(el=>{try{new QRCode(el,{text:el.dataset.qr||' ',width:80,height:80})}catch(e){}});
  drawShape();
}

/* Gambar bentuk kertas (SVG) di belakang isi struk, mengikuti tinggi isi */
function drawShape(){
  const s=settings(), r=$('#receipt');
  const W=r.offsetWidth, H=r.offsetHeight;
  if(!H)return;
  const sp=SHAPES[s.shape]||SHAPES.lurus, t=Math.max(4,+s.t||10);
  const m=s.shadow?32:0;
  const old=r.querySelector('svg.shape'); if(old)old.remove();
  r.insertAdjacentHTML('afterbegin',
   `<svg class="shape" xmlns="http://www.w3.org/2000/svg" width="${W+2*m}" height="${H+2*m}" viewBox="${-m} ${-m} ${W+2*m} ${H+2*m}" style="position:absolute;left:${-m}px;top:${-m}px;pointer-events:none">`
   +(s.shadow?'<defs><filter id="shd" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter></defs>':'')
   +`<path d="${shapePath(sp,W,H,t)}" fill="${esc(s.paper||'#fff')}"${s.shadow?' filter="url(#shd)"':''}/></svg>`);
}
/* kalau tinggi struk berubah (mis. logo selesai dimuat), bentuk kertas ikut menyesuaikan */
new ResizeObserver(()=>drawShape()).observe($('#receipt'));

function itemsHTML(items){
  const prodOpts=sel=>PRODUCTS.map(p=>`<option ${!sel.custom&&p.name===sel.name?'selected':''}>${esc(p.name)}</option>`).join('')+`<option value="__custom" ${sel.custom?'selected':''}>✎ Ketik manual…</option>`;
  return `<table class="tbl"><tr><th style="width:62px">Qty</th><th>Produk</th><th style="width:130px">Harga</th><th></th></tr>`
   +items.map((it,i)=>`<tr data-i="${i}">
     <td><select data-c="qty">${QTY.map(q=>`<option ${q===it.qty?'selected':''}>${q}</option>`).join('')}</select></td>
     <td><select data-c="name">${prodOpts(it)}</select>${it.custom?`<input class="cn" data-c="cname" placeholder="Nama produk" value="${esc(it.name)}">`:''}</td>
     <td>${moneyHTML(it.price,'data-c="price"')}</td>
     <td><button class="x" data-c="rm" title="Hapus">✕</button></td></tr>`).join('')
   +`</table><button class="btn ghost" data-c="addrow">+ Tambah item</button>`;
}

function field(f,v){
  const a=`data-k="${f.k}"`;
  if(f.t==='items')return itemsHTML(v);
  if(f.t==='check')return `<label class="row"><input type="checkbox" style="width:auto" ${a} ${v?'checked':''}> ${f.l}</label>`;
  let i;
  if(f.t==='textarea')i=`<textarea ${a}>${esc(v)}</textarea>`;
  else if(f.t==='select')i=`<select ${a}>${f.o.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
  else if(f.t==='file')i=`<input type="file" accept="image/*" ${a}>`;
  else if(f.t==='money')i=moneyHTML(v,a);
  else i=`<input type="${f.t}" value="${esc(v)}" ${a}>`;
  return `<label>${f.l}</label>${i}`;
}

function bindItems(el,b){
  const items=b.data.items, tbl=el.querySelector('.tbl');
  const rowOf=t=>items[+t.closest('tr').dataset.i];
  tbl.addEventListener('change',e=>{
    const t=e.target,it=t.closest('tr')&&rowOf(t),c=t.dataset.c;
    if(c==='qty')it.qty=+t.value;
    else if(c==='name'){
      if(t.value==='__custom'){it.custom=true;it.name=''}
      else{it.custom=false;it.name=t.value;it.price=PRODUCTS.find(p=>p.name===t.value).price}
      renderForm();
    }
    renderReceipt();
  });
  tbl.addEventListener('input',e=>{
    const t=e.target,c=t.dataset.c;
    if(c==='price')rowOf(t).price=moneyInput(t);
    else if(c==='cname')rowOf(t).name=t.value;
    else return;
    renderReceipt();
  });
  tbl.addEventListener('click',e=>{
    if(e.target.dataset.c==='rm'){items.splice(+e.target.closest('tr').dataset.i,1);renderForm();renderReceipt()}
  });
  el.querySelector('[data-c=addrow]').onclick=()=>{
    const p=PRODUCTS[0]||{name:'',price:0};
    items.push({qty:1,name:p.name,price:p.price,custom:false});
    renderForm();renderReceipt();
  };
}

/* Tahan & geser lewat ikon ⠿ (jalan di mouse & layar sentuh) */
function startDrag(e,el,box){
  e.preventDefault();
  el.classList.add('drag');
  const move=ev=>{
    const others=[...box.children].filter(c=>c!==el&&c.dataset.type!=='settings');
    const target=others.find(c=>{const r=c.getBoundingClientRect();return ev.clientY<r.top+r.height/2});
    box.insertBefore(el,target||null);
  };
  const up=()=>{
    window.removeEventListener('pointermove',move);
    const ids=[...box.children].map(c=>+c.dataset.id);
    blocks=ids.map(id=>blocks.find(b=>b.id===id));
    renderForm();renderReceipt();
  };
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up,{once:true});
  window.addEventListener('pointercancel',up,{once:true});
}

function renderForm(){
  const box=$('#blocks'); box.innerHTML='';
  blocks.forEach((b,i)=>{
    const T=TYPES[b.type], el=document.createElement('div'), fixed=b.type==='settings';
    el.className='blk'+(b.open?' open':'');
    el.dataset.id=b.id; el.dataset.type=b.type;
    el.innerHTML=`<div class="bh">${fixed?'':'<span class="grip" title="Tahan & geser">⠿</span>'}<span class="t">${T.name}</span>
      ${fixed?'':`<button data-a="up" title="Naik">↑</button><button data-a="down" title="Turun">↓</button><button data-a="dup" title="Duplikat">⧉</button><button class="del" data-a="del" title="Hapus">✕</button>`}</div>
      <div class="bb">${T.fields.map(f=>field(f,b.data[f.k])).join('')}</div>`;
    const grip=el.querySelector('.grip');
    if(grip)grip.onpointerdown=e=>startDrag(e,el,box);
    el.querySelector('.bh').onclick=e=>{
      if(e.target.closest('.grip'))return;
      const a=e.target.dataset.a;
      if(a==='up'&&i>1)[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];
      else if(a==='down'&&i<blocks.length-1)[blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]];
      else if(a==='dup')blocks.splice(i+1,0,{...b,id:++uid,data:JSON.parse(JSON.stringify(b.data))});
      else if(a==='del')blocks.splice(i,1);
      else if(!a)b.open=!b.open;
      renderForm();renderReceipt();
    };
    el.querySelectorAll('[data-k]').forEach(inp=>{
      const f=T.fields.find(x=>x.k===inp.dataset.k);
      inp.oninput=inp.onchange=()=>{
        if(f.t==='file'){const fr=new FileReader();fr.onload=()=>{b.data[f.k]=fr.result;renderReceipt()};if(inp.files[0])fr.readAsDataURL(inp.files[0]);return}
        b.data[f.k]=f.t==='check'?inp.checked:f.t==='number'?+inp.value:f.t==='money'?moneyInput(inp):inp.value;
        renderReceipt();
      };
    });
    if(b.type==='items')bindItems(el,b);
    box.appendChild(el);
  });
}

$('#addType').innerHTML=Object.keys(TYPES).filter(t=>t!=='settings').map(t=>`<option value="${t}">${TYPES[t].name}</option>`).join('');
$('#credit').onchange=renderReceipt;
$('#chgOn').onchange=()=>{$('#chgBox').style.display=$('#chgOn').checked?'block':'none';renderReceipt()};
$('#chgPaid').oninput=e=>{paidAmt=moneyInput(e.target);renderReceipt()};
$('#addBtn').onclick=()=>{add($('#addType').value);blocks[blocks.length-1].open=true;renderForm();renderReceipt()};

/* ===== EXPORT ===== */
async function snap(){
  drawShape();
  const sc=+settings().scale||3;
  const canvas=await html2canvas($('#capture'),{scale:sc,backgroundColor:null});
  return{canvas,sc};
}
$('#dl').onclick=async()=>{
  const {canvas}=await snap();
  const a=document.createElement('a');a.download='struk.png';a.href=canvas.toDataURL('image/png');a.click();
};
$('#dlPdf').onclick=async()=>{
  const {canvas,sc}=await snap();
  const {jsPDF}=window.jspdf, k=25.4/96;               /* px -> mm */
  const w=canvas.width/sc*k, h=canvas.height/sc*k;
  const pdf=new jsPDF({orientation:w>h?'l':'p',unit:'mm',format:[w,h]});
  pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,w,h);
  pdf.save('struk.pdf');
};
renderForm();renderReceipt();
</script>
